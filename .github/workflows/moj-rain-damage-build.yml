name: Build MOJ rain-damage 1.6 DLL
on:
  pull_request:
    paths:
      - 'Source/AMJ.MOJ.Drying/**'
      - 'Patches/Production/RainDamageDryingRacks.xml'
      - '.github/workflows/moj-rain-damage-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Obtain pinned public Processor Framework 1.6 DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .refs
          curl --fail --location --retry 2 --silent --show-error \
            'https://raw.githubusercontent.com/ViralReaction/ProcessorFramework/c919cd188d0e1695fb6b50a5396393a336a87ab0/1.6/Assemblies/ProcessorFramework.dll' \
            -o .refs/ProcessorFramework.dll
          test -s .refs/ProcessorFramework.dll
      - name: Compile against RimWorld 1.6 reference assemblies
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Source/AMJ.MOJ.Drying/AMJ.MOJ.Drying.csproj \
            -c Release --nologo -p:NuGetAudit=false \
            -p:ProcessorFrameworkDll="$GITHUB_WORKSPACE/.refs/ProcessorFramework.dll" \
            -o "$RUNNER_TEMP/moj-rain-output"
          test -s "$RUNNER_TEMP/moj-rain-output/AncientMedievalJapanMOJDrying.dll"
          python3 - "$RUNNER_TEMP/moj-rain-output/AncientMedievalJapanMOJDrying.dll" <<'PY'
          import pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          assert data.startswith(b'MZ'), 'Not a valid .NET PE assembly'
          print(f'VALID_PE bytes={len(data)}')
          PY
          sha256sum "$RUNNER_TEMP/moj-rain-output/AncientMedievalJapanMOJDrying.dll"
          echo 'MOJ_RAIN_DLL_BASE64_BEGIN'
          base64 -w0 "$RUNNER_TEMP/moj-rain-output/AncientMedievalJapanMOJDrying.dll"
          echo
          echo 'MOJ_RAIN_DLL_BASE64_END'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: moj-rain-damage-16
          path: ${{ runner.temp }}/moj-rain-output/AncientMedievalJapanMOJDrying.dll
          retention-days: 3
