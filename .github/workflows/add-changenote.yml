name: Add Changenote metadata validation
on:
  workflow_dispatch:
concurrency:
  group: add-changenote-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python Tests/Release/validate_add_changenote.py
      - run: python -m unittest discover -s Tests/Production -p 'test_full_amj_suite_and_straw.py' -v
