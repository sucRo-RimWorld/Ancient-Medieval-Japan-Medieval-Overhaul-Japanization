name: Build MOJ wall-pole candidate graphics
on:
  pull_request:
    paths:
      - 'Defs/ThingDefs_Buildings/WallDryingPole.xml'
      - 'Tools/Art/Build-WallDryingPole.py'
      - 'Patches/Production/WallDryingPoleFish.xml'
      - '.github/workflows/moj-wallpole-graphics.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render deterministic candidate sprites
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==12.0.0'
          python Tools/Art/Build-WallDryingPole.py "$RUNNER_TEMP/moj-wallpole"
          python - "$RUNNER_TEMP/moj-wallpole" <<'PY'
          import base64, pathlib, sys
          from PIL import Image
          root=pathlib.Path(sys.argv[1])
          paths=sorted(root.glob('*.png')) + sorted((root.parent/'WallDryingPoleLarge').glob('*.png'))
          assert len(paths)==26, f'Expected 26 1.6 graphic states, got {len(paths)}'
          for p in paths:
              with Image.open(p) as im:
                  assert im.size == (256, 256) and im.mode == 'RGBA'
                  assert im.getpixel((0, 0)) == (0, 0, 0, 0)
              print('AMJ_WALLPOLE_PNG',p.name,base64.b64encode(p.read_bytes()).decode())
          for stem in ('WallDryingPole', 'WallDryingPoleLarge'):
              directory=root if stem=='WallDryingPole' else root.parent/'WallDryingPoleLarge'
              images={direction:Image.open(directory/f'{stem}FilledMeat_{direction}.png').convert('RGBA') for direction in ('north','south','east','west')}
              assert len({im.tobytes() for im in images.values()}) == 4, f'{stem}: orientation duplicate'
              for direction,im in images.items():
                  a=im.getchannel('A')
                  b=a.getbbox()
                  assert b, f'{stem}: empty sprite'
                  w,h=b[2]-b[0],b[3]-b[1]
                  if direction in ('north','south'): assert w>h, (stem,direction,w,h)
                  else: assert h>w, (stem,direction,w,h)
              print('AMJ_WALLPOLE_DIRECTION_PASS',stem)
          print('AMJ_WALLPOLE_SPRITES_OK',len(paths))
          PY
